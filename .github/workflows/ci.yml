# Builds the image and pushes it to ghcr.io/fullaxx/ubuntu-desktop, tagged by branch:
#   master -> :latest (the README's docker pull), :26.04 and :resolute, the same image
#   24.04  -> :24.04 and :noble, the same image
# plus :<branch>-<short sha> for each build. "Run workflow" in the Actions tab does the same by hand for
# the branch it runs on (any other branch publishes only its <branch>-<short sha>).
# The codename tags name each release the way Ubuntu's own image does (ubuntu:resolute is
# ubuntu:26.04, ubuntu:noble is ubuntu:24.04).
# The same file is in master and 24.04 (a push runs the ci.yml of the pushed commit), and 24.04 takes
# CI changes by cherry-pick.
# Nothing is checked before the build: monthly.yml checks the downloads that the install scripts fetch
# (Tor Browser, DeaDBeeF).
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master, "24.04" ]   # quoted, or YAML reads it as a number

jobs:
  build:
    runs-on: ubuntu-26.04

    # Only what this job needs: read the repository and push to ghcr.io
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest, :26.04 and :resolute from master, :24.04 and :noble from its branch, plus
      # <branch>-<short sha> for each build (by branch name, so :latest stays with master even if
      # GitHub's default branch changes)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fullaxx/ubuntu-desktop
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=26.04,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=resolute,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=24.04,enable=${{ github.ref == 'refs/heads/24.04' }}
            type=raw,value=noble,enable=${{ github.ref == 'refs/heads/24.04' }}
            type=sha,prefix={{branch}}-

      # The GitHub Actions cache keeps unchanged layers between pushes
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
